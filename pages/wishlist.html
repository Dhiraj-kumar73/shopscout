<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>My Saved Wishlist — ShopScout</title>
  <meta name="description" content="View and manage your saved products, monitor price drops, and get verified deals from Amazon India.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🛍️%3C/text%3E%3C/svg%3E">
  
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/navbar.css">
  <link rel="stylesheet" href="../css/product-card.css">
  <link rel="stylesheet" href="../css/cart.css">
  <link rel="stylesheet" href="../css/responsive.css">
</head>
<body>


  <!-- ==================== CLEAN BRANDED PLATFORM HEADER ==================== -->
  <header class="site-header inner-page-header" id="main-header">
    <div class="inner-header-container">
      
      <!-- Back to Home -->
      <a href="../index.html" class="inner-header-back-btn" title="Back to Home" aria-label="Back to Home">
        <i class="fa-solid fa-arrow-left"></i> <span class="back-btn-text">Back to Home</span>
      </a>

      <!-- Prominent Platform Branding (Center) -->
      <a href="../index.html" class="inner-header-logo">
        <span class="brand-icon-wrap"><i class="fa-solid fa-bag-shopping"></i></span>
        <span class="brand-title">ShopScout<span class="brand-dot">.</span></span>
      </a>

      <!-- Theme Toggle & Cart -->
      <div class="inner-header-actions">
        <button class="nav-cart-btn" onclick="CartService.openDrawer()" title="View Shopping Cart">
          <i class="fa-solid fa-bag-shopping"></i>
          <span class="cart-count-badge" style="display: none;">0</span>
        </button>
        <button class="theme-toggle-btn" title="Toggle Theme" aria-label="Theme toggle">
          <i class="fa-regular fa-moon moon-icon"></i>
          <i class="fa-solid fa-sun sun-icon"></i>
        </button>
      </div>

    </div>
  </header>

  <!-- ==================== MOBILE SLIDE DRAWER ==================== -->
  <div class="mobile-nav-drawer" id="mobile-drawer">
    <div class="drawer-header">
      <a href="../index.html" class="brand-logo" style="font-size: 1.2rem;">
        <span class="brand-icon-wrap" style="width:32px; height:32px; font-size:0.9rem;"><i class="fa-solid fa-bag-shopping"></i></span>
        <span>ShopScout</span>
      </a>
      <button class="drawer-close-btn">&times;</button>
    </div>
    <div style="padding: 1rem 1.25rem;">
      <div class="mega-search-bar" style="border-radius: var(--radius-sm);">
        <input type="text" class="mega-search-input header-search-input" placeholder="Search products..." onkeydown="if(event.key==='Enter') window.location.href='search.html?q='+encodeURIComponent(this.value)">
      </div>
    </div>
    <nav class="drawer-nav-list">
      <a href="../index.html" class="drawer-nav-link"><i class="fa-solid fa-house"></i> Home</a>
      <a href="products.html" class="drawer-nav-link"><i class="fa-solid fa-layer-group"></i> All Products</a>
      <a href="categories.html" class="drawer-nav-link"><i class="fa-solid fa-shapes"></i> Categories</a>
      <a href="deals.html" class="drawer-nav-link" style="color:var(--deal-orange);font-weight:700;"><i class="fa-solid fa-fire"></i> Today's Deals</a>
      <a href="compare.html" class="drawer-nav-link"><i class="fa-solid fa-scale-balanced"></i> Price Compare</a>
      <a href="wishlist.html" class="drawer-nav-link"><i class="fa-regular fa-heart"></i> My Wishlist</a>
    </nav>
  </div>

  <main class="main-content">
    <div class="container" style="padding-top: 1.5rem; padding-bottom: 2rem;">
      
      <div style="display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 2rem; flex-wrap: wrap; gap: 1rem;">
        <div>
          <span class="section-badge"><i class="fa-regular fa-heart"></i> Saved Items</span>
          <h1 style="font-size: 2.25rem; font-weight: 800; margin-bottom: 0.35rem;">My Wishlist</h1>
          <p id="wishlist-count-header" style="color: var(--muted); font-size: 0.95rem;">0 saved items</p>
        </div>
        <button class="btn btn-outline btn-sm" onclick="WishlistController.clearAll()">
          <i class="fa-solid fa-trash-can"></i> Clear Wishlist
        </button>
      </div>

      <!-- Wishlist Grid -->
      <div class="product-grid" id="wishlist-grid"></div>

    </div>
  </main>

  <!-- Footer -->
  <footer style="background-color: var(--surface); border-top: 1px solid var(--border); padding: 2.5rem 0 1.5rem; text-align: center; font-size: 0.85rem; color: var(--muted);">
    <div class="container">
      <p>&copy; 2026 ShopScout. All rights reserved. <a href="affiliate-disclosure.html" style="color: var(--primary); text-decoration: underline;">Affiliate Disclosure</a></p>
    </div>
  </footer>



  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
  <script src="../js/firebase-config.js"></script>

  <script src="../js/main.js"></script>
  <script src="../js/navbar.js"></script>
  <script src="../js/products.js"></script>
  <script src="../js/cart.js"></script>
  <script src="../js/wishlist.js"></script>
</body>
</html>
