<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password — ShopScout India</title>
  <meta name="description" content="Reset your ShopScout account password to regain access to your price drop alerts and saved items.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🛍️</text></svg>">
  
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/navbar.css">
  <link rel="stylesheet" href="../css/auth.css">
  <link rel="stylesheet" href="../css/responsive.css">
</head>
<body>

  <!-- Header -->
  <header class="site-header">
    <div class="container header-container" style="justify-content: space-between;">
      <div style="display: flex; align-items: center; gap: 1.5rem;">
        <a href="../index.html" class="brand-logo">
          <span class="brand-icon-wrap"><i class="fa-solid fa-bag-shopping"></i></span>
          <span>ShopScout<span class="brand-tagline-dot">.</span></span>
        </a>
        <a href="login.html" class="auth-back-link">
          <i class="fa-solid fa-arrow-left"></i> Back to Sign In
        </a>
      </div>
      <div class="header-actions">
        <button class="header-action-btn theme-toggle-btn" title="Toggle Theme">
          <i class="fa-regular fa-moon moon-icon"></i>
          <i class="fa-solid fa-sun sun-icon"></i>
        </button>
      </div>
    </div>
  </header>

  <main class="main-content auth-page-wrap">
    <div style="max-width: 460px; width: 100%; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-xl, 20px); padding: 2.75rem 2.25rem; box-shadow: 0 20px 50px rgba(15, 23, 42, 0.1);">
      <div class="auth-header" style="text-align: center;">
        <div style="width: 56px; height: 56px; border-radius: 50%; background: var(--primary-light); color: var(--primary); display: inline-flex; align-items: center; justify-content: center; font-size: 1.5rem; margin-bottom: 1rem;">
          <i class="fa-solid fa-key"></i>
        </div>
        <h1 class="auth-title">Reset Password</h1>
        <p class="auth-subtitle">Enter your registered email address and we'll send you an instant reset link.</p>
      </div>

      <form id="forgot-form">
        <div class="form-group">
          <label class="form-label" for="forgot-email">Email Address</label>
          <div class="input-with-icon">
            <i class="fa-regular fa-envelope input-icon"></i>
            <input type="email" id="forgot-email" class="form-control" placeholder="name@example.com" required autocomplete="email">
          </div>
        </div>

        <button type="submit" class="btn-auth-submit" style="margin-top: 1.25rem;">
          Send Reset Link <i class="fa-solid fa-paper-plane"></i>
        </button>
      </form>

      <div style="text-align: center; margin-top: 1.75rem; font-size: 0.88rem; color: var(--muted);">
        Remembered your password? <a href="login.html" style="color: var(--primary); font-weight: 700; text-decoration: none;">Sign In</a>
      </div>
    </div>
  </main>

  <script src="../js/main.js"></script>
  <script src="../js/navbar.js"></script>
  <script src="../js/auth.js"></script>
</body>
</html>
