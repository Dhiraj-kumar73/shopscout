<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Search Products & Deals — ShopScout</title>
  <meta name="description" content="Search products, brands, models, and deals across leading verified online marketplaces.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🛍️</text></svg>">
  
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/navbar.css">
  <link rel="stylesheet" href="../css/product-card.css">
  <link rel="stylesheet" href="../css/responsive.css">
</head>
<body>


  <!-- ==================== CLEAN BRANDED PLATFORM HEADER ==================== -->
  <header class="site-header" id="main-header" style="background: var(--surface); border-bottom: 1px solid var(--border); padding: 0.85rem 0;">
    <div class="container" style="display: flex; align-items: center; justify-content: space-between;">
      
      <!-- Back to Home -->
      <a href="../index.html" class="btn btn-outline btn-sm" style="display: inline-flex; align-items: center; gap: 0.5rem; font-weight: 700; border-radius: var(--radius-full); padding: 0.45rem 1.1rem; text-decoration: none;">
        <i class="fa-solid fa-arrow-left"></i> <span>Back to Home</span>
      </a>

      <!-- Prominent Platform Branding (Center) -->
      <a href="../index.html" class="brand-logo" style="font-size: 1.6rem; display: inline-flex; align-items: center; gap: 0.65rem; text-decoration: none;">
        <span class="brand-icon-wrap" style="width: 42px; height: 42px; font-size: 1.25rem; background: var(--primary); color: #fff; border-radius: 12px; display: inline-flex; align-items: center; justify-content: center; box-shadow: 0 4px 14px rgba(37, 99, 235, 0.3);"><i class="fa-solid fa-bag-shopping"></i></span>
        <span style="font-family: var(--font-heading); font-weight: 800; color: var(--text); letter-spacing: -0.02em;">ShopScout<span style="color: var(--deal-orange);">.</span></span>
      </a>

      <!-- Theme Toggle -->
      <div style="display: flex; align-items: center; gap: 0.5rem;">
        <button class="theme-toggle-btn" title="Toggle Theme" aria-label="Theme toggle" style="width: 38px; height: 38px; border-radius: 50%; border: 1px solid var(--border); background: var(--surface-subtle); display: flex; align-items: center; justify-content: center; cursor: pointer; color: var(--text);">
          <i class="fa-regular fa-moon moon-icon"></i>
          <i class="fa-solid fa-sun sun-icon"></i>
        </button>
      </div>

    </div>
  </header>

  <!-- ==================== MOBILE SLIDE DRAWER ==================== -->
  <div class="mobile-nav-drawer" id="mobile-drawer">
    <div class="drawer-header">
      <a href="../index.html" class="brand-logo" style="font-size: 1.2rem;">
        <span class="brand-icon-wrap" style="width:32px; height:32px; font-size:0.9rem;"><i class="fa-solid fa-bag-shopping"></i></span>
        <span>ShopScout</span>
      </a>
      <button class="drawer-close-btn">&times;</button>
    </div>
    <div style="padding: 1rem 1.25rem;">
      <div class="mega-search-bar" style="border-radius: var(--radius-sm);">
        <input type="text" class="mega-search-input header-search-input" placeholder="Search products..." onkeydown="if(event.key==='Enter') window.location.href='search.html?q='+encodeURIComponent(this.value)">
      </div>
    </div>
    <nav class="drawer-nav-list">
      <a href="../index.html" class="drawer-nav-link"><i class="fa-solid fa-house"></i> Home</a>
      <a href="products.html" class="drawer-nav-link"><i class="fa-solid fa-layer-group"></i> All Products</a>
      <a href="categories.html" class="drawer-nav-link"><i class="fa-solid fa-shapes"></i> Categories</a>
      <a href="deals.html" class="drawer-nav-link" style="color:var(--deal-orange);font-weight:700;"><i class="fa-solid fa-fire"></i> Today's Deals</a>
      <a href="compare.html" class="drawer-nav-link"><i class="fa-solid fa-scale-balanced"></i> Price Compare</a>
      <a href="wishlist.html" class="drawer-nav-link"><i class="fa-regular fa-heart"></i> My Wishlist</a>
    </nav>
  </div>

  <main class="main-content">
    <div class="container" style="padding-top: 2.5rem; padding-bottom: 4.5rem;">
      
      <!-- Search Input Header -->
      <div style="max-width: 640px; margin: 0 auto 2.5rem; text-align: center;">
        <h1 style="font-size: 2.2rem; font-weight: 800; margin-bottom: 1.25rem;">
          Results for <span id="search-query-display" style="color: var(--primary);">All Products</span>
        </h1>
        
        <form id="search-page-form" style="display: flex; gap: 0.5rem; margin-bottom: 1rem;">
          <input type="text" id="search-page-input" class="form-control" placeholder="Search by name, brand, or category..." style="padding: 0.75rem 1.25rem; font-size: 1rem;">
          <button type="submit" class="btn btn-primary" style="padding: 0.75rem 1.5rem;">Search</button>
        </form>

        <!-- Quick Search Pills -->
        <div style="display: flex; gap: 0.5rem; justify-content: center; flex-wrap: wrap; font-size: 0.825rem; color: var(--muted);">
          <span>Try searching:</span>
          <a href="search.html?q=Speaker" class="badge" style="background: var(--surface); border: 1px solid var(--border); color: var(--text);">Speaker</a>
          <a href="search.html?q=JBL" class="badge" style="background: var(--surface); border: 1px solid var(--border); color: var(--text);">JBL</a>
          <a href="search.html?q=Audio" class="badge" style="background: var(--surface); border: 1px solid var(--border); color: var(--text);">Audio</a>
          <a href="search.html?q=Gaming" class="badge" style="background: var(--surface); border: 1px solid var(--border); color: var(--text);">Gaming</a>
          <a href="search.html?q=Laptops" class="badge" style="background: var(--surface); border: 1px solid var(--border); color: var(--text);">Laptops</a>
          <a href="search.html?q=Mouse" class="badge" style="background: var(--surface); border: 1px solid var(--border); color: var(--text);">Mouse</a>
        </div>
      </div>

      <!-- Results Count Bar -->
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem; padding-bottom: 0.75rem; border-bottom: 1px solid var(--border);">
        <span id="search-results-count" style="font-weight: 600; color: var(--muted);">Searching...</span>
        <a href="products.html" class="btn btn-outline btn-sm">Browse All Products</a>
      </div>

      <!-- Results Grid -->
      <div class="product-grid" id="search-results-grid"></div>

    </div>
  </main>

  <!-- Footer -->
  <footer style="background-color: var(--surface); border-top: 1px solid var(--border); padding: 2.5rem 0 1.5rem; text-align: center; font-size: 0.85rem; color: var(--muted);">
    <div class="container">
      <p>&copy; 2026 ShopScout. All rights reserved. <a href="affiliate-disclosure.html" style="color: var(--primary); text-decoration: underline;">Affiliate Disclosure</a></p>
    </div>
  </footer>

  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
  <script src="../js/firebase-config.js"></script>

  <script src="../js/main.js"></script>
  <script src="../js/navbar.js"></script>
  <script src="../js/products.js"></script>
  <script src="../js/search.js"></script>
</body>
</html>
