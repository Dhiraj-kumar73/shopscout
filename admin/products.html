<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manage Products — ShopScout Admin</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🛍️</text></svg>">
  
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/admin.css">
  <link rel="stylesheet" href="../css/responsive.css">
</head>
<body class="admin-body">

  <aside class="admin-sidebar">
    <div class="admin-sidebar-header">
      <div class="brand-icon-wrap" style="width: 34px; height: 34px; font-size: 0.95rem; flex-shrink:0;"><i class="fa-solid fa-bag-shopping"></i></div>
      <div style="font-family: var(--font-heading); font-size: 1.2rem; font-weight: 800; color: #fff; line-height:1.2;">
        ShopScout <span style="font-size: 0.6rem; background: rgba(99,102,241,0.35); color: #a5b4fc; padding: 0.15rem 0.45rem; border-radius: 4px; vertical-align: middle; font-weight:700; letter-spacing:0.05em;">ADMIN</span>
      </div>
    </div>
    <nav class="admin-nav">
      <a href="dashboard.html" class="admin-nav-link"><i class="fa-solid fa-chart-pie"></i> Dashboard</a>
      <a href="products.html" class="admin-nav-link active"><i class="fa-solid fa-box-archive"></i> Products</a>
      <a href="categories.html" class="admin-nav-link"><i class="fa-solid fa-shapes"></i> Categories</a>
      <a href="deals.html" class="admin-nav-link"><i class="fa-solid fa-fire"></i> Deals</a>
      <a href="users.html" class="admin-nav-link"><i class="fa-solid fa-users"></i> Users</a>
      <a href="analytics.html" class="admin-nav-link"><i class="fa-solid fa-chart-line"></i> Analytics</a>
    </nav>
    <div class="admin-sidebar-footer">
      <a href="../index.html" style="display:flex; align-items:center; justify-content:center; gap:0.5rem; padding:0.6rem 1rem; background:rgba(255,255,255,0.08); border:1px solid rgba(255,255,255,0.15); border-radius:var(--radius-sm); color:rgba(255,255,255,0.75); font-size:0.85rem; font-weight:600; text-decoration:none; transition:all 0.2s ease;" onmouseover="this.style.background='rgba(255,255,255,0.15)'" onmouseout="this.style.background='rgba(255,255,255,0.08)'">
        <i class="fa-solid fa-arrow-up-right-from-square" style="font-size:0.8rem;"></i> View Live Site
      </a>
    </div>
  </aside>

  <div class="admin-main">
    <header class="admin-topbar">
      <div style="display:flex; align-items:center; gap:0.75rem;">
        <div style="font-size: 1.1rem; font-weight: 800; color: var(--text); letter-spacing:-0.01em;">Product Management</div>
        <span style="font-size:0.72rem; background:var(--primary-light); color:var(--primary); padding:0.18rem 0.55rem; border-radius:var(--radius-full); font-weight:700;">Live Catalog</span>
      </div>
      <div style="display: flex; align-items: center; gap: 0.75rem;">
        <button class="header-action-btn theme-toggle-btn" title="Toggle Theme"><i class="fa-regular fa-moon moon-icon"></i><i class="fa-solid fa-sun sun-icon"></i></button>
      </div>
    </header>

    <main class="admin-content">
      
      <div class="admin-card">
        <div class="admin-card-header">
          <div style="display: flex; gap: 1rem; align-items: center; flex: 1; max-width: 400px;">
            <input type="text" id="admin-prod-search" class="form-control" placeholder="Search catalog by title, brand...">
          </div>
          <button class="btn btn-primary btn-sm" id="btn-add-product-modal">
            <i class="fa-solid fa-plus"></i> Add Product
          </button>
        </div>

        <div class="table-responsive">
          <table class="admin-table">
            <thead>
              <tr>
                <th>Product</th>
                <th>Price</th>
                <th>Marketplace</th>
                <th>Status</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="admin-products-tbody">
              <!-- Rendered by js/admin.js -->
            </tbody>
          </table>
        </div>
      </div>

    </main>
  </div>

  <!-- Add / Edit Product Modal -->
  <div class="modal-overlay" id="product-modal">
    <div class="modal-card" style="max-width: 560px; text-align: left;">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.25rem;">
        <h3 style="font-size: 1.35rem; font-weight: 800;" id="product-modal-title">Add New Product</h3>
        <button type="button" class="btn btn-outline btn-sm" id="btn-autofill-sample" style="font-size: 0.75rem;">
          <i class="fa-solid fa-wand-magic-sparkles"></i> Auto-fill Sample
        </button>
      </div>
      
      <form id="product-crud-form">
        <input type="hidden" id="modal-prod-id">

        <!-- Quick URL Smart Auto-Detector -->
        <div style="background: var(--surface-subtle); border: 1px dashed var(--border); border-radius: var(--radius-sm); padding: 0.85rem; margin-bottom: 1.25rem;">
          <label class="form-label" style="display: flex; align-items: center; justify-content: space-between; font-size: 0.8rem;">
            <span><i class="fa-solid fa-bolt" style="color: var(--warning);"></i> <strong>Quick Auto-Fill from URL (Flipkart / Amazon)</strong></span>
            <span style="color: var(--muted); font-size: 0.7rem;">Paste URL &amp; click Auto-Detect</span>
          </label>
          <div style="display: flex; gap: 0.5rem; margin-top: 0.35rem;">
            <input type="url" id="modal-quick-url" class="form-control" placeholder="https://www.flipkart.com/... or amazon.in/...">
            <button type="button" class="btn btn-primary btn-sm" id="btn-quick-url-parse" style="white-space: nowrap; font-size: 0.8rem;">
              <i class="fa-solid fa-wand-magic-sparkles"></i> Auto-Detect
            </button>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="modal-prod-name">Product Title</label>
          <input type="text" id="modal-prod-name" class="form-control" required placeholder="e.g. Samsung Galaxy M34 5G (Waterfall Blue, 128 GB)">
        </div>

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
          <div class="form-group">
            <label class="form-label" for="modal-prod-brand">Brand</label>
            <input type="text" id="modal-prod-brand" class="form-control" required placeholder="e.g. Sony">
          </div>
          <div class="form-group">
            <label class="form-label" for="modal-prod-category">Category</label>
            <select id="modal-prod-category" class="form-control form-select" required>
              <option value="Audio">Audio</option>
              <option value="Laptops">Laptops</option>
              <option value="Mobiles">Mobiles</option>
              <option value="Watches">Watches</option>
              <option value="Gaming">Gaming</option>
              <option value="Home & Kitchen">Home & Kitchen</option>
              <option value="Gadgets">Gadgets</option>
              <option value="Fashion">Fashion</option>
            </select>
          </div>
        </div>

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
          <div class="form-group">
            <label class="form-label" for="modal-prod-price">Current Price (₹)</label>
            <input type="number" id="modal-prod-price" class="form-control" required placeholder="26990">
          </div>
          <div class="form-group">
            <label class="form-label" for="modal-prod-original-price">MRP / Original (₹)</label>
            <input type="number" id="modal-prod-original-price" class="form-control" placeholder="34990">
          </div>
        </div>

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
          <div class="form-group">
            <label class="form-label" for="modal-prod-marketplace">Primary Marketplace</label>
            <select id="modal-prod-marketplace" class="form-control form-select">
              <option value="Amazon">Amazon</option>
              <option value="Flipkart">Flipkart</option>
            </select>
          </div>
          <div class="form-group">
            <label class="form-label" for="modal-prod-affiliate-url">Affiliate Tracking URL</label>
            <input type="text" id="modal-prod-affiliate-url" class="form-control" placeholder="https://amazon.in/dp/...?tag=...">
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="modal-prod-image">Main Image URL (Front / Primary View)</label>
          <input type="url" id="modal-prod-image" class="form-control" placeholder="Auto-filled or paste image address...">
        </div>

        <div class="form-group">
          <label class="form-label" for="modal-prod-gallery">Multi-Angle Gallery Images (Optional, one URL per line)</label>
          <textarea id="modal-prod-gallery" class="form-control" rows="2" placeholder="Back view URL&#10;Side profile URL&#10;Camera close-up URL"></textarea>
        </div>

        <div class="form-group">
          <label class="form-label" for="modal-prod-description">Short Description</label>
          <input type="text" id="modal-prod-description" class="form-control" placeholder="Brief summary of the product...">
        </div>

        <div class="form-group">
          <label class="form-label" for="modal-prod-features">Key Features (One per line or comma separated)</label>
          <textarea id="modal-prod-features" class="form-control" rows="3" placeholder="Qualcomm Snapdragon Processor&#10;5000 mAh Battery with fast charging&#10;50MP Ultra Clear Camera"></textarea>
        </div>

        <div style="display: flex; gap: 0.75rem; justify-content: flex-end; margin-top: 1.5rem;">
          <button type="button" class="btn btn-outline btn-sm" id="btn-cancel-product-modal">Cancel</button>
          <button type="submit" class="btn btn-primary btn-sm">Save Product</button>
        </div>
      </form>
    </div>
  </div>

  <script src="../js/main.js"></script>
  <script src="../js/products.js"></script>
  <script src="../js/admin.js"></script>
</body>
</html>
