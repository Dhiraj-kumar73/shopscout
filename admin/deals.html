<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manage Deals — ShopScout Admin</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🛍️</text></svg>">
  
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/admin.css">
  <link rel="stylesheet" href="../css/responsive.css">
</head>
<body class="admin-body">

  <aside class="admin-sidebar">
    <div class="admin-sidebar-header">
      <div class="brand-icon-wrap" style="width: 32px; height: 32px; font-size: 0.9rem;"><i class="fa-solid fa-bag-shopping"></i></div>
      <div style="font-family: var(--font-heading); font-size: 1.25rem; font-weight: 800; color: var(--text);">
        ShopScout <span style="font-size: 0.65rem; background: var(--primary-light); color: var(--primary); padding: 0.15rem 0.4rem; border-radius: var(--radius-xs); vertical-align: middle;">ADMIN</span>
      </div>
    </div>
    <nav class="admin-nav">
      <a href="dashboard.html" class="admin-nav-link"><i class="fa-solid fa-chart-pie"></i> Dashboard</a>
      <a href="products.html" class="admin-nav-link"><i class="fa-solid fa-box-archive"></i> Products</a>
      <a href="categories.html" class="admin-nav-link"><i class="fa-solid fa-shapes"></i> Categories</a>
      <a href="deals.html" class="admin-nav-link active"><i class="fa-solid fa-fire"></i> Deals</a>
      <a href="users.html" class="admin-nav-link"><i class="fa-solid fa-users"></i> Users</a>
      <a href="analytics.html" class="admin-nav-link"><i class="fa-solid fa-chart-line"></i> Analytics</a>
    </nav>
    <div class="admin-sidebar-footer">
      <a href="../index.html" class="btn btn-outline btn-sm" style="width: 100%; justify-content: center;">
        <i class="fa-solid fa-arrow-up-right-from-square"></i> View Live Site
      </a>
    </div>
  </aside>

  <div class="admin-main">
    <header class="admin-topbar">
      <div style="font-size: 1.15rem; font-weight: 700; color: var(--text);">Deals &amp; Price Drop Scheduler</div>
      <div style="display: flex; align-items: center; gap: 1rem;">
        <button class="header-action-btn theme-toggle-btn" title="Toggle Theme"><i class="fa-regular fa-moon moon-icon"></i><i class="fa-solid fa-sun sun-icon"></i></button>
      </div>
    </header>

    <main class="admin-content">
      <div class="admin-card">
        <div class="admin-card-header">
          <h2 class="admin-card-title">Active Promoted Deals</h2>
          <button class="btn btn-primary btn-sm" onclick="ShopScout.toast('Deal creator is enabled', 'info')">
            <i class="fa-solid fa-plus"></i> Schedule New Deal
          </button>
        </div>
        <div class="table-responsive">
          <table class="admin-table">
            <thead>
              <tr>
                <th>Product</th>
                <th>Discount</th>
                <th>Deal Price</th>
                <th>Store</th>
                <th>Status</th>
              </tr>
            </thead>
            <tbody id="admin-deals-tbody">
              <!-- Populated by admin.js -->
            </tbody>
          </table>
        </div>
      </div>
    </main>
  </div>

  <script src="../js/main.js"></script>
  <script src="../js/products.js"></script>
  <script src="../js/admin.js"></script>
</body>
</html>
